name: Build iOS Simulator App

on:
  push:
    branches:
      - main
    paths:
      - 'care101_app/**'
      - '.github/workflows/build-ios-simulator.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Override EXPO_PUBLIC_API_URL (Optional)'
        required: false
        default: ''
        type: string
      create_github_release:
        description: 'Attach the simulator .app.zip to a GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag to use for the GitHub Release (for example, v2.2.4)'
        required: false
        default: ''
        type: string

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios-simulator:
    name: Build iOS Simulator App (with QueueWidget)
    runs-on: macos-15
    timeout-minutes: 60

    outputs:
      app_zip_name: ${{ steps.prepare.outputs.app_zip_name }}

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SCHEME: carelinkdoctorapp
      DERIVED_DATA: ${{ github.workspace }}/care101_app/ios/build/DerivedData

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Xcode (WidgetKit containerBackground/AppIntents need the iOS 17+ SDK)
      # ---------------------------------------------------------
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ---------------------------------------------------------
      # 3. Node.js + npm cache
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: care101_app/package-lock.json

      # ---------------------------------------------------------
      # 4. Configure environment (same secrets as the Android workflow)
      # ---------------------------------------------------------
      - name: Configure Environment
        working-directory: care101_app
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          API_URL_INPUT: ${{ inputs.api_url }}
          API_URL_SECRET: ${{ secrets.EXPO_PUBLIC_API_URL }}
          OPENROUTER_KEY: ${{ secrets.EXPO_PUBLIC_OPENROUTER_API_KEY }}
          STRIPE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -n "$DOT_ENV" ]; then
            echo "::notice::Using DOT_ENV from GitHub Secrets."
            printf '%s\n' "$DOT_ENV" > .env
            if [ -n "$API_URL_INPUT" ]; then
              sed -i '' '/^EXPO_PUBLIC_API_URL=/d' .env
              echo "EXPO_PUBLIC_API_URL=$API_URL_INPUT" >> .env
            fi
          else
            echo "::notice::Creating .env from GitHub Secrets."

            API_URL="$API_URL_INPUT"
            if [ -z "$API_URL" ]; then
              API_URL="$API_URL_SECRET"
            fi

            if [ -z "$API_URL" ]; then
              echo "::error::EXPO_PUBLIC_API_URL is not configured."
              exit 1
            fi
            if [ -z "$OPENROUTER_KEY" ]; then
              echo "::error::EXPO_PUBLIC_OPENROUTER_API_KEY is not configured."
              exit 1
            fi
            if [ -z "$STRIPE_KEY" ]; then
              echo "::error::EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY is not configured."
              exit 1
            fi

            cat > .env << EOF
          EXPO_PUBLIC_API_URL=$API_URL
          EXPO_PUBLIC_OPENROUTER_API_KEY=$OPENROUTER_KEY
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=$STRIPE_KEY
          EOF
          fi

          echo "Environment configured successfully."

      - name: Install Dependencies
        working-directory: care101_app
        run: npm ci --prefer-offline

      # ---------------------------------------------------------
      # 5. CocoaPods (cached)
      # ---------------------------------------------------------
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            care101_app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('care101_app/ios/Podfile', 'care101_app/ios/Podfile.properties.json', 'care101_app/package-lock.json') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install Pods
        working-directory: care101_app/ios
        run: pod install

      # ---------------------------------------------------------
      # 6. Build (Release, JS bundle embedded, ad-hoc signed so the
      #    App Group shared with the widget works in the simulator)
      # ---------------------------------------------------------
      - name: Build Simulator App
        working-directory: care101_app/ios
        run: |
          set -eo pipefail

          echo "========================================"
          echo "Care101 iOS Simulator Build"
          echo "Configuration: Release"
          echo "Targets: carelinkdoctorapp + QueueWidget"
          echo "========================================"

          xcodebuild \
            -workspace carelinkdoctorapp.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build > xcodebuild.log 2>&1 || {
              echo "::error::xcodebuild failed. Errors:"
              grep -E "error:" xcodebuild.log | head -40
              tail -60 xcodebuild.log
              exit 1
            }

          grep -E "\*\* BUILD" xcodebuild.log

      # ---------------------------------------------------------
      # 7. Package .app (must contain the widget extension)
      # ---------------------------------------------------------
      - name: Prepare App
        id: prepare
        run: |
          set -e

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphonesimulator/$SCHEME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app generated."
            exit 1
          fi
          if [ ! -d "$APP_PATH/PlugIns/QueueWidget.appex" ]; then
            echo "::error::QueueWidget.appex is missing from the app bundle."
            exit 1
          fi

          mkdir -p build_output
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FINAL_NAME="Care101_ios_simulator_${TIMESTAMP}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build_output/$FINAL_NAME"
          FILE_SIZE=$(du -h "build_output/$FINAL_NAME" | cut -f1)

          echo "APP_ZIP=build_output/$FINAL_NAME" >> "$GITHUB_ENV"
          echo "APP_ZIP_NAME=$FINAL_NAME" >> "$GITHUB_ENV"
          echo "app_zip_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🍎 Care101 iOS Simulator App

          | Property | Value |
          |---|---|
          | Configuration | \`Release\` |
          | Widget | \`QueueWidget.appex\` ✅ |
          | Archive | \`$FINAL_NAME\` |
          | Size | \`$FILE_SIZE\` |

          **Install:** unzip, then \`xcrun simctl install booted carelinkdoctorapp.app\`
          (or drag the .app onto a running simulator).
          EOF

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ZIP_NAME }}
          path: ${{ env.APP_ZIP }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: care101_app/ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------
      # 8. Optional GitHub Release (same tag as the Android APK)
      # ---------------------------------------------------------
      #    Adds the .app.zip to a draft release; the release is published
      #    once the Android workflow has attached its APK too.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_github_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('build-{0}', github.run_number) }}
        run: bash .github/scripts/attach-to-release.sh "$TAG" "$APP_ZIP"

  # -----------------------------------------------------------
  # Install + launch the built app on specific iPhone simulators
  # -----------------------------------------------------------
  test-on-devices:
    name: Run on ${{ matrix.device }}
    needs: build-ios-simulator
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        device:
          - iPhone 17 Pro
          - iPhone 18 Pro

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download App Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ios-simulator.outputs.app_zip_name }}
          path: artifact

      - name: Boot ${{ matrix.device }} Simulator
        id: sim
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -eo pipefail
          xcodebuild -version

          TYPE_ID=$(xcrun simctl list devicetypes -j \
            | jq -r --arg n "$DEVICE" '.devicetypes[] | select(.name == $n) | .identifier' | head -1)
          if [ -z "$TYPE_ID" ]; then
            echo "::error::'$DEVICE' simulator is not available in this Xcode. Available iPhones:"
            xcrun simctl list devicetypes | grep -i iphone
            exit 1
          fi

          # Newest installed iOS runtime that supports this device type
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r --arg t "$TYPE_ID" '
            [.runtimes[]
              | select(.platform == "iOS" and .isAvailable)
              | select(any(.supportedDeviceTypes[]?; .identifier == $t))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          if [ -z "$RUNTIME_ID" ]; then
            echo "::error::No installed iOS runtime supports '$DEVICE'."
            xcrun simctl list runtimes
            exit 1
          fi

          UDID=$(xcrun simctl create "Care101 $DEVICE" "$TYPE_ID" "$RUNTIME_ID")
          echo "Created $DEVICE ($RUNTIME_ID): $UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME_ID" >> "$GITHUB_OUTPUT"

      - name: Install and Launch App
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -eo pipefail

          ZIP=$(ls artifact/*.app.zip | head -1)
          ditto -x -k "$ZIP" app
          APP=$(ls -d app/*.app | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

          # Give the app time to start; it must still be running afterwards
          sleep 25
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BUNDLE_ID"; then
            echo "::error::App exited or crashed on $DEVICE shortly after launch."
            exit 1
          fi

          SHOT="screenshot-${DEVICE// /-}.png"
          xcrun simctl io "$UDID" screenshot "$SHOT"
          echo "SHOT=$SHOT" >> "$GITHUB_ENV"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ✅ $DEVICE
          Installed and launched \`$BUNDLE_ID\` on \`${{ steps.sim.outputs.runtime }}\`; app still running after 25s.
          EOF

      - name: Upload Screenshot
        if: always() && env.SHOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHOT }}
          path: ${{ env.SHOT }}
          if-no-files-found: ignore
          retention-days: 14
